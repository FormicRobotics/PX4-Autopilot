module_name: DShot Driver
serial_config:
    - command: dshot telemetry -d ${SERIAL_DEV}
      port_config_param:
        name: DSHOT_TEL_CFG
        group: DShot

parameters:
    - group: DShot
      definitions:
        DSHOT_MIN:
            description:
                short: Minimum DShot Motor Output
                long: |
                    Minimum Output Value for DShot in percent. The value depends on the ESC. Make
                    sure to set this high enough so that the motors are always spinning while
                    armed.
            type: float
            unit: norm
            min: 0
            max: 1
            decimal: 2
            increment: 0.01
            default: 0.055
        DSHOT_3D_ENABLE:
            description:
                short: Allows for 3d mode when using DShot and suitable mixer
                long: |
                    WARNING: ESC must be configured for 3D mode, and DSHOT_MIN set to 0.
                    This splits the throttle ranges in two.
                    Direction 1) 48 is the slowest, 1047 is the fastest.
                    Direction 2) 1049 is the slowest, 2047 is the fastest.
                    When mixer outputs 1000 or value inside DSHOT 3D deadband, DShot 0 is sent.
            type: boolean
            default: 0
        DSHOT_BIDIR_EN:
            description:
                short: Enable bidirectional DShot
                long: |
                    This parameter enables bidirectional DShot which provides RPM feedback.
                    Note that this requires ESCs that support bidirectional DSHot, e.g. BlHeli32.
                    This is not the same as DShot telemetry which requires an additional serial connection.
            type: boolean
            default: 0
            reboot_required: true
        DSHOT_3D_DEAD_H:
            description:
                short: DSHOT 3D deadband high
                long: |
                    When the actuator_output is between DSHOT_3D_DEAD_L and DSHOT_3D_DEAD_H, motor will not spin.
                    This value is with respect to the mixer_module range (0-1999), not the DSHOT values.
            type: int32
            min: 1000
            max: 1999
            default: 1000
        DSHOT_3D_DEAD_L:
            description:
                short: DSHOT 3D deadband low
                long: |
                    When the actuator_output is between DSHOT_3D_DEAD_L and DSHOT_3D_DEAD_H, motor will not spin.
                    This value is with respect to the mixer_module range (0-1999), not the DSHOT values.
            type: int32
            min: 0
            max: 1000
            default: 1000
        MOT_POLE_COUNT: # only used by dshot so far, so keep it under the dshot group
            description:
                short: Number of magnetic poles of the motors
                long: |
                    Specify the number of magnetic poles of the motors.
                    It is required to compute the RPM value from the eRPM returned with the ESC telemetry.

                    Either get the number from the motor spec sheet or count the magnets on the bell of the motor (not the stator magnets).
                    Typical motors for 5 inch props have 14 poles.
            type: int32
            default: 14

    - group: Turtle Recovery
      definitions:
        TRTL_EN:
            description:
                short: "Enable experimental Quad-X turtle recovery"
                long: |
                    Enable only after mapping and verifying the ESC profile. Commander rejects arming until startup restoration is sent and the switch has been released. This feature intentionally permits motor output while disarmed.
            type: int32
            min: 0
            max: 1
            default: 0
        TRTL_ESC:
            description:
                short: "Verified temporary-direction ESC profile"
                long: |
                    0 unconfigured. Set 1 only after verifying your exact ESC firmware supports temporary relative DShot 21 reverse and 20 normal, including repeated commands while stopped. No ESC settings are saved. This is an acknowledgement by the operator, not automatic ESC detection.
            type: int32
            min: 0
            max: 1
            default: 0
        TRTL_CH:
            description:
                short: "Turtle receiver channel"
                long: |
                    One-based calibrated receiver channel. It must not share roll, pitch, yaw, throttle, arm, kill, flight mode, parameter tuning or other critical functions. Generic AUX sharing is allowed. RC source only.
            type: int32
            min: 1
            max: 18
            default: 9
        TRTL_POL:
            description:
                short: "Turtle switch polarity"
                long: |
                    Use 1 for high=ON or -1 for low=ON. Zero is invalid. After polarity, ON is above 0.7 and OFF is below -0.3; center stops recovery but does not reset the switch handshake.
            type: int32
            min: -1
            max: 1
            default: 1
        TRTL_ANGLE:
            description:
                short: "Minimum tilt to START recovery"
                long: |
                    Degrees away from upright. Entry needs a fresh OFF to ON request followed by a hold. 85 allows a nominal 90-degree side-on start. Must be at least EXIT plus 10 degrees. This is not proof that the aircraft is on the ground.
            type: int32
            min: 60
            max: 175
            default: 120
            unit: "deg"
        TRTL_EXIT:
            description:
                short: "Tilt at which recovery STOPS"
                long: |
                    Separate threshold from ANGLE. Once started, a flip can continue through the entry angle until it reaches this near-upright tilt or another stop condition. Must be at least 10 degrees below ANGLE.
            type: int32
            min: 5
            max: 80
            default: 35
            unit: "deg"
        TRTL_MIN:
            description:
                short: "Starting recovery motor command"
                long: |
                    PX4 non-stop DShot command units, not measured RPM, thrust or percent power. Must not exceed MAX. Defaults come from a 2.5-inch development airframe and are not universal recommendations.
            type: int32
            min: 1
            max: 1999
            default: 850
        TRTL_MAX:
            description:
                short: "Maximum recovery motor command"
                long: |
                    PX4 DShot command units. Full stick reaches this target in proportional mode. Verify reverse thrust, motor start, current and heating for the actual propulsion system.
            type: int32
            min: 1
            max: 1999
            default: 1500
        TRTL_RAMP:
            description:
                short: "Recovery upward ramp time"
                long: |
                    Ramps the output cap from MIN to MAX. Reset when the selected motor set changes or the stick is centered. Must not exceed TIME. Zero disables the ramp.
            type: int32
            min: 0
            max: 1500
            default: 250
            unit: "ms"
        TRTL_TIME:
            description:
                short: "Maximum DRIVE phase duration"
                long: |
                    Starts when the motor-driving phase begins, not during reverse or settling. Motor stopping and restore phases have a separate derived transaction budget.
            type: int32
            min: 100
            max: 3000
            default: 1000
            unit: "ms"
        TRTL_PRE:
            description:
                short: "Stop time before reverse commands"
                long: |
                    Time spent transmitting stop before temporary reversal. Choose from measured coast-down on the actual motor and propeller; this is not RPM confirmation.
            type: int32
            min: 100
            max: 5000
            default: 800
            unit: "ms"
        TRTL_POST:
            description:
                short: "Stop time before restore commands"
                long: |
                    Time spent transmitting stop before normal-direction restore. Increase for slower-stopping propulsion. A fixed delay does not prove the motor stopped.
            type: int32
            min: 200
            max: 5000
            default: 1000
            unit: "ms"
        TRTL_SETTLE:
            description:
                short: "Stop time after reversal commands"
                long: |
                    Stopped interval after a reverse command train, before drive.
            type: int32
            min: 100
            max: 1000
            default: 200
            unit: "ms"
        TRTL_COOL:
            description:
                short: "Cooldown after restore commands"
                long: |
                    Stopped interval after restore, before requiring switch OFF for release.
            type: int32
            min: 100
            max: 2000
            default: 300
            unit: "ms"
        TRTL_DB:
            description:
                short: "Recovery roll/pitch deadband"
                long: |
                    Percent of normalized roll or pitch. Diagonal deflection selects a single corner; axis-only input selects a pair.
            type: int32
            min: 5
            max: 60
            default: 20
            unit: "%"
        TRTL_PWR:
            description:
                short: "Use proportional stick power"
                long: |
                    1 maps stick magnitude above deadband to MIN..MAX with the ramp cap. 0 retains a timed ramp to MAX regardless of stick magnitude.
            type: int32
            min: 0
            max: 1
            default: 1
        TRTL_HOLD:
            description:
                short: "Deliberate activation hold"
                long: |
                    Continuous eligibility after a fresh OFF-to-ON request while disarmed. Switch OFF for at least 300 ms is required between attempts and after RC loss.
            type: int32
            min: 100
            max: 1000
            default: 400
            unit: "ms"
        TRTL_FL:
            description:
                short: "Front-left logical motor"
                long: |
                    PX4 logical Motor 1..4 at the front-left corner, looking down with the quad upright and nose forward. Not a connector number. All four must be distinct; 0 is unconfigured. Allocation positions and axes must agree.
            type: int32
            min: 0
            max: 4
            default: 0
        TRTL_FR:
            description:
                short: "Front-right logical motor"
                long: |
                    PX4 logical Motor 1..4 at the front-right corner, looking down with the quad upright and nose forward. Not a connector number. All four must be distinct; 0 is unconfigured. Allocation positions and axes must agree.
            type: int32
            min: 0
            max: 4
            default: 0
        TRTL_RL:
            description:
                short: "Rear-left logical motor"
                long: |
                    PX4 logical Motor 1..4 at the rear-left corner, looking down with the quad upright and nose forward. Not a connector number. All four must be distinct; 0 is unconfigured. Allocation positions and axes must agree.
            type: int32
            min: 0
            max: 4
            default: 0
        TRTL_RR:
            description:
                short: "Rear-right logical motor"
                long: |
                    PX4 logical Motor 1..4 at the rear-right corner, looking down with the quad upright and nose forward. Not a connector number. All four must be distinct; 0 is unconfigured. Allocation positions and axes must agree.
            type: int32
            min: 0
            max: 4
            default: 0
